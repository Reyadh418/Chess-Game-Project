<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum Chess</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="review-page-body home-page-body">
    <div class="hero-grid">
        <header class="topbar">
            <div>
                <p class="eyebrow">Premium Chess Experience</p>
                <h1>Aurum Chess</h1>
            </div>
            <div class="top-actions">
                <button id="startGameBtn" class="primary" type="button" aria-label="Start a new chess match">Start Game</button>
                <button id="resetProgressBtn" class="ghost" type="button" title="Reset unlocks" aria-label="Reset unlocked themes">Reset Unlocks</button>
            </div>
        </header>

        <main class="layout home-layout">
            <section class="panel controls">
                <div class="control-block">
                    <div class="label-row">
                        <p class="label">Mode</p>
                        <span class="pill">Setup</span>
                    </div>
                    <div class="segmented" role="group" aria-label="Game mode">
                        <button type="button" data-mode="ai" class="seg active" id="modeAI" aria-pressed="true">Player vs AI</button>
                        <button type="button" data-mode="pvp" class="seg" id="modePvp" aria-pressed="false">Pass & Play</button>
                    </div>
                </div>

                <div class="control-block" id="aiControls">
                    <p class="label">AI Difficulty</p>
                    <div class="segmented small" role="group" aria-label="AI difficulty">
                        <button type="button" data-difficulty="easy" class="seg active" aria-pressed="true">Easy</button>
                        <button type="button" data-difficulty="medium" class="seg" aria-pressed="false">Medium</button>
                        <button type="button" data-difficulty="hard" class="seg" aria-pressed="false">Hard</button>
                        <button type="button" data-difficulty="grandmaster" class="seg" aria-pressed="false">Grandmaster</button>
                    </div>
                </div>

                <div class="control-block" id="playerColorControls" style="display: none;">
                    <p class="label">Play As</p>
                    <div class="chips" role="group" aria-label="Player color">
                        <button type="button" data-color="white" class="chip" aria-pressed="false">White</button>
                        <button type="button" data-color="black" class="chip" aria-pressed="false">Black</button>
                        <button type="button" data-color="random" class="chip active" aria-pressed="true">Random</button>
                    </div>
                </div>

                <div class="control-block">
                    <p class="label">Time Mode</p>
                    <div class="chips" id="timeControls" role="group" aria-label="Time mode">
                        <button type="button" data-time="untimed" class="chip active" aria-pressed="true">No clock</button>
                        <button type="button" data-time="180" class="chip" aria-pressed="false">3:00</button>
                        <button type="button" data-time="600" class="chip" aria-pressed="false">10:00</button>
                    </div>
                </div>

                <div class="control-block">
                    <div class="label-row">
                        <p class="label">Board Skins</p>
                        <span class="value" id="unlockText">1 / 10</span>
                    </div>
                    <div class="theme-grid" id="themeGrid" role="group" aria-label="Board skins"></div>
                    <p class="hint">Select your setup and start. Matches now open in a dedicated match page.</p>
                </div>
            </section>
        </main>
    </div>

    <template id="themeCardTemplate">
        <button type="button" class="theme-card">
            <span class="swatch" aria-hidden="true"></span>
            <span class="title"></span>
            <span class="lock" aria-hidden="true">Locked</span>
        </button>
    </template>

    <script type="module" src="js/home.js"></script>
</body>
</html>
